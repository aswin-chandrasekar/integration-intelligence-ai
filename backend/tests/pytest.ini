[pytest]
# Pytest configuration for integration detection tests

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers
markers =
    parser: Parser unit tests
    engine: Recommendation/Risk engine tests
    golden: Golden output comparison tests
    integration: Full integration tests
    slow: Slow running tests
    http: HTTP parser tests
    flask: Flask parser tests
    db: Database parser tests
    file: File operations tests
    recommendations: Recommendation engine tests
    risk: Risk analysis tests

# Coverage options (if pytest-cov is installed)
# --cov=backend --cov-report=html

# Timeout for tests (requires pytest-timeout)
# timeout = 300
